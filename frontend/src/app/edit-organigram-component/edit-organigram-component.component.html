@if (dataLoaded) {
  <h2 mat-dialog-title>Modifica organigramma</h2>
}
@if (dataLoaded) {
  <mat-dialog-content>
    <p>{{ data.description }}</p>
    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }
    <br>
      <!-- Organigrammi -->
      @if (section === 'Organigrammi') {
        <div class="input-column">
          <div class="form-group row">
            <div class="col-sm-8">
              <mat-form-field class="example-full-width">
                <mat-label>* Nome:</mat-label>
                <input matInput placeholder="Nome" class="form-control" [(ngModel)]="organigramName">
              </mat-form-field>
            </div>
          </div>
        </div>
        <br>
          <div class="button-group">
            <button mat-button class="confirm-button" (click)="updateOrganigram()">Ok</button>
            <button mat-button class="cancel-button" (click)="cancelEdit()">Annulla</button>
          </div>
        }
      </mat-dialog-content>
    }
